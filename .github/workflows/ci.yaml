name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint chart/stalwart

      - name: Helm template (defaults)
        run: helm template stalwart chart/stalwart

      - name: Assert config.json is valid and carries a DataStore
        run: |
          helm template stalwart chart/stalwart | python3 -c '
          import sys, json, yaml
          for d in yaml.safe_load_all(sys.stdin):
              if d and d.get("kind") == "ConfigMap" and "config.json" in d.get("data", {}):
                  cfg = json.loads(d["data"]["config.json"])
                  assert "@type" in cfg, "config.json has no @type discriminator"
                  print("config.json OK:", cfg["@type"])
                  break
          else:
              raise SystemExit("no config.json ConfigMap rendered")
          '

      - name: Assert the metrics Service keeps its name
        run: |
          helm template stalwart chart/stalwart --set metrics.enabled=true \
            | grep -q "name: stalwart-metrics"

      - name: Assert publishNotReadyAddresses renders only when enabled
        run: |
          helm template stalwart chart/stalwart --show-only templates/service.yaml \
            --set service.publishNotReadyAddresses=true \
            | grep -q "publishNotReadyAddresses: true"
          if helm template stalwart chart/stalwart --show-only templates/service.yaml \
            | grep -q publishNotReadyAddresses; then
            echo "::error::publishNotReadyAddresses rendered by default" >&2
            exit 1
          fi

      - name: Assert existingClaim replaces the volumeClaimTemplate at the same mount path
        run: |
          check='
          import sys, yaml
          claim, path = sys.argv[1:]
          sts = next(d for d in yaml.safe_load_all(sys.stdin) if d and d.get("kind") == "StatefulSet")
          pod = sts["spec"]["template"]["spec"]
          mounts = [m["mountPath"] for m in pod["containers"][0]["volumeMounts"] if m["name"] == "data"]
          assert mounts == [path], f"data mounted at {mounts}, want {path}"
          vols = [v for v in pod.get("volumes") or [] if v["name"] == "data"]
          vcts = sts["spec"].get("volumeClaimTemplates") or []
          if claim:
              assert [v["persistentVolumeClaim"]["claimName"] for v in vols] == [claim], vols
              assert not vcts, "volumeClaimTemplates rendered although existingClaim is set"
          else:
              assert not vols, "data pod volume rendered although existingClaim is unset"
              assert [t["metadata"]["name"] for t in vcts] == ["data"], vcts
          '
          helm template stalwart chart/stalwart | python3 -c "$check" "" /var/lib/stalwart
          helm template stalwart chart/stalwart --set persistence.existingClaim=mail-data \
            | python3 -c "$check" mail-data /var/lib/stalwart
          helm template stalwart chart/stalwart --set persistence.existingClaim=mail-data --set dataPath=/data \
            | python3 -c "$check" mail-data /data
          if out=$(helm template stalwart chart/stalwart --set persistence.existingClaim=mail-data \
            --set persistence.enabled=false 2>&1); then
            echo "::error::existingClaim rendered with persistence disabled" >&2
            exit 1
          fi
          grep -q "persistence.existingClaim is set" <<<"$out"

      - name: Helm template (examples)
        run: |
          for f in examples/*.yaml; do
            echo "--- Templating with $f ---"
            helm template stalwart chart/stalwart -f "$f"
          done

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate templates
        run: |
          helm template stalwart chart/stalwart | kubeconform -strict -ignore-missing-schemas
          for f in examples/*.yaml; do
            echo "--- Validating with $f ---"
            helm template stalwart chart/stalwart -f "$f" | kubeconform -strict -ignore-missing-schemas
          done

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Guards against cutting a tag without bumping Chart.yaml, which would
      # republish the previous chart version over itself.
      - name: Package chart
        run: |
          chart_version=$(helm show chart chart/stalwart | awk '/^version:/ {print $2}')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml version $chart_version does not match tag $tag_version" >&2
            exit 1
          fi
          helm package chart/stalwart

      - name: Push to OCI registry
        run: helm push stalwart-*.tgz oci://ghcr.io/itsh-cloud/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: stalwart-*.tgz
          # Defaults to false, so a path that stops matching drops the asset
          # from the release without failing the run.
          fail_on_unmatched_files: true
